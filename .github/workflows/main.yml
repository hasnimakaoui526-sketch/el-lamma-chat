name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract ElLamma project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'ElLamma_FINAL_1.1.4.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ElLamma_FINAL_1.1.4.zip not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/settings.gradle" ] && [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found."
            find extracted -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Android project detected."

          echo "PROJECT_ROOT=extracted" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle :app:assembleRelease --no-daemon

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find app/build/outputs -type f -maxdepth 6 || true
            exit 1
          fi

          echo "Release APK generated successfully:"
          ls -lh "$APK"

      - name: Validate permanent signing secrets
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.ELLAMMA_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Checking permanent signing secrets..."

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ELLAMMA_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ELLAMMA_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ELLAMMA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "All three signing secrets are present."

      - name: Decode permanent keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ELLAMMA_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/ellamma-release.keystore"

          echo "Decoding permanent keystore..."

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Decoded keystore size:"
          stat -c '%s bytes' "$KEYSTORE"

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Validate permanent keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
        run: |
          set -e

          echo "Validating permanent keystore..."

          if keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keytool-list.txt \
            2> /tmp/keytool-error.txt; then

            echo "Keystore password accepted."

          else
            echo
            echo "ERROR: The permanent keystore could not be opened."
            echo
            echo "This usually means one of these is wrong:"
            echo "1. ELLAMMA_KEYSTORE_PASSWORD"
            echo "2. ELLAMMA_KEYSTORE_BASE64"
            echo "3. The keystore itself is invalid or corrupted."
            echo
            echo "keytool diagnostic:"
            cat /tmp/keytool-error.txt
            exit 1
          fi

          echo
          echo "Available aliases:"
          cat /tmp/keytool-list.txt

          echo
          echo "Checking requested alias: $KEY_ALIAS"

          if keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/keytool-alias.txt \
            2> /tmp/keytool-alias-error.txt; then

            echo "Alias '$KEY_ALIAS' exists."

          else
            echo
            echo "ERROR: Alias '$KEY_ALIAS' was not found."
            echo
            echo "Alias diagnostic:"
            cat /tmp/keytool-alias-error.txt
            echo
            echo "Available aliases:"
            cat /tmp/keytool-list.txt
            exit 1
          fi

          echo
          echo "Permanent keystore validation successful."

      - name: Align and sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
        run: |
          set -e

          UNSIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release-aligned.apk"
          SIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Unsigned APK not found."
            exit 1
          fi

          echo "Aligning APK..."

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          echo "Signing APK with permanent key..."

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          echo "Verifying APK signature..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$SIGNED"

          echo
          echo "========================================"
          echo "PERMANENT SIGNING SUCCESSFUL"
          echo "========================================"

          ls -lh "$SIGNED"

          rm -f "$ALIGNED"

      - name: Calculate SHA256
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK not found."
            exit 1
          fi

          sha256sum "$APK" > app-release-sha256.txt

          echo
          echo "APK SHA256:"
          cat app-release-sha256.txt

      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-Release-Signed-Permanent
          path: |
            extracted/app/build/outputs/apk/release/ElLamma-release.apk
            app-release-sha256.txt
          if-no-files-found: error
