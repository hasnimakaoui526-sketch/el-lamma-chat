name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      # =========================================================
      # 4. Extract ElLamma project
      # =========================================================
      - name: Extract ElLamma project
        shell: bash
        run: |
          set -e

          echo "Searching for ElLamma_FINAL_1.1.4.zip..."

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'ElLamma_FINAL_1.1.4.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ElLamma_FINAL_1.1.4.zip was not found."
            echo
            echo "Files found in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/settings.gradle" ] &&
             [ ! -f "extracted/settings.gradle.kts" ]; then

            echo "ERROR: Android project was not found after extraction."

            echo
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | sort

            exit 1
          fi

          echo
          echo "Android project detected successfully."

          echo "PROJECT_ROOT=extracted" >> "$GITHUB_ENV"


      # =========================================================
      # 5. Install Gradle 8.9
      # =========================================================
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          echo "Downloading Gradle 8.9..."

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          echo
          echo "Gradle version:"
          gradle --version


      # =========================================================
      # 6. Build Release APK
      # =========================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Building release APK..."

          gradle :app:assembleRelease --no-daemon

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Release APK was not generated."

            echo
            echo "Available build outputs:"
            find app/build/outputs -type f | sort || true

            exit 1
          fi

          echo
          echo "Release APK generated successfully:"
          ls -lh "$UNSIGNED"


      # =========================================================
      # 7. Check signing secrets
      # =========================================================
      - name: Validate permanent signing secrets
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.ELLAMMA_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Checking permanent signing secrets..."

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ELLAMMA_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ELLAMMA_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ELLAMMA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "All required signing secrets are present."


      # =========================================================
      # 8. Decode permanent keystore safely
      # =========================================================
      - name: Decode permanent keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ELLAMMA_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/ellamma-release.keystore"

          echo "Preparing permanent keystore..."

          CLEAN_BASE64="$(printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '[:space:]')"

          if [ -z "$CLEAN_BASE64" ]; then
            echo "ERROR: ELLAMMA_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          echo "Base64 characters received: ${#CLEAN_BASE64}"

          # -----------------------------------------------------
          # Normalize URL-safe Base64 if it was copied in that form
          # -----------------------------------------------------
          CLEAN_BASE64="${CLEAN_BASE64//-/+}"
          CLEAN_BASE64="${CLEAN_BASE64//_//}"

          # -----------------------------------------------------
          # Calculate and repair missing Base64 padding
          # -----------------------------------------------------
          LENGTH=${#CLEAN_BASE64}
          REMAINDER=$((LENGTH % 4))

          if [ "$REMAINDER" -eq 1 ]; then
            echo "ERROR: Invalid Base64 length."
            echo "The ELLAMMA_KEYSTORE_BASE64 secret is not valid Base64."
            exit 1
          fi

          if [ "$REMAINDER" -eq 2 ]; then
            CLEAN_BASE64="${CLEAN_BASE64}=="
          elif [ "$REMAINDER" -eq 3 ]; then
            CLEAN_BASE64="${CLEAN_BASE64}="
          fi

          # -----------------------------------------------------
          # Validate characters before decoding
          # -----------------------------------------------------
          if ! printf '%s' "$CLEAN_BASE64" \
            | grep -Eq '^[A-Za-z0-9+/]*={0,2}$'; then

            echo "ERROR: ELLAMMA_KEYSTORE_BASE64 contains invalid characters."
            echo
            echo "The secret must contain the Base64 representation"
            echo "of the permanent .keystore file."
            echo
            echo "Do NOT paste the binary keystore itself."
            echo "Do NOT paste a GitHub secret name."
            exit 1
          fi

          echo "Base64 format validation passed."

          # -----------------------------------------------------
          # Decode using Python for reliable validation
          # -----------------------------------------------------
          CLEAN_BASE64="$CLEAN_BASE64" KEYSTORE="$KEYSTORE" python3 <<'PY'
          import os
          import base64
          import binascii

          value = os.environ["CLEAN_BASE64"]
          output = os.environ["KEYSTORE"]

          try:
              data = base64.b64decode(value, validate=True)
          except (binascii.Error, ValueError) as exc:
              print("ERROR: Base64 decoding failed.")
              print(f"Decoder message: {exc}")
              raise SystemExit(1)

          if not data:
              print("ERROR: Decoded keystore is empty.")
              raise SystemExit(1)

          with open(output, "wb") as f:
              f.write(data)

          print("Base64 decoding completed successfully.")
          print(f"Decoded bytes: {len(data)}")
          PY

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          fi

          echo
          echo "Decoded keystore size:"
          stat -c '%s bytes' "$KEYSTORE"

          echo
          echo "Permanent keystore file created successfully."

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"


      # =========================================================
      # 9. Validate keystore password and alias
      # =========================================================
      - name: Validate permanent keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
        run: |
          set -e

          echo "Validating permanent keystore..."

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file does not exist."
            exit 1
          fi

          # -----------------------------------------------------
          # Test keystore password
          # -----------------------------------------------------
          if keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keytool-list.txt \
            2> /tmp/keytool-error.txt; then

            echo "Keystore password accepted."

          else

            echo
            echo "========================================"
            echo "KEYSTORE VALIDATION FAILED"
            echo "========================================"
            echo
            echo "The Base64 file was decoded, but Java"
            echo "could not open the keystore with the"
            echo "configured ELLAMMA_KEYSTORE_PASSWORD."
            echo
            echo "keytool diagnostic:"
            cat /tmp/keytool-error.txt

            exit 1
          fi

          echo
          echo "Available aliases:"
          cat /tmp/keytool-list.txt

          echo
          echo "Checking requested alias..."

          if keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/keytool-alias.txt \
            2> /tmp/keytool-alias-error.txt; then

            echo "Alias '$KEY_ALIAS' exists."

          else

            echo
            echo "========================================"
            echo "ALIAS VALIDATION FAILED"
            echo "========================================"
            echo
            echo "The keystore is valid, but the configured"
            echo "ELLAMMA_KEY_ALIAS does not exist."
            echo
            echo "Configured alias:"
            echo "$KEY_ALIAS"
            echo
            echo "Available aliases:"
            cat /tmp/keytool-list.txt
            echo
            echo "Diagnostic:"
            cat /tmp/keytool-alias-error.txt

            exit 1
          fi

          echo
          echo "Permanent keystore validation successful."


      # =========================================================
      # 10. Align APK
      # =========================================================
      - name: Align Release APK
        shell: bash
        run: |
          set -e

          UNSIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release-aligned.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Unsigned APK not found."
            exit 1
          fi

          echo "Running zipalign..."

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          if [ ! -f "$ALIGNED" ]; then
            echo "ERROR: zipalign did not create the aligned APK."
            exit 1
          fi

          echo "APK alignment successful."
          ls -lh "$ALIGNED"


      # =========================================================
      # 11. Sign APK permanently
      # =========================================================
      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
        run: |
          set -e

          ALIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release-aligned.apk"
          SIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -f "$ALIGNED" ]; then
            echo "ERROR: Aligned APK not found."
            exit 1
          fi

          echo "Signing APK with permanent keystore..."

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          if [ ! -f "$SIGNED" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo
          echo "Permanent signing completed."

          ls -lh "$SIGNED"


      # =========================================================
      # 12. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          SIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          echo "Verifying APK signature..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$SIGNED"

          echo
          echo "========================================"
          echo "PERMANENT SIGNING SUCCESSFUL"
          echo "APK SIGNATURE VERIFIED"
          echo "========================================"


      # =========================================================
      # 13. Calculate SHA256
      # =========================================================
      - name: Calculate SHA256
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK not found."
            exit 1
          fi

          sha256sum "$APK" > app-release-sha256.txt

          echo
          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          cat app-release-sha256.txt


      # =========================================================
      # 14. Upload final APK
      # =========================================================
      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-Release-Signed-Permanent
          path: |
            extracted/app/build/outputs/apk/release/ElLamma-release.apk
            app-release-sha256.txt
          if-no-files-found: error


      # =========================================================
      # 15. Cleanup
      # =========================================================
      - name: Cleanup temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ellamma-release.keystore" || true
          rm -f "$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release-aligned.apk" || true

          echo "Temporary signing files cleaned."
