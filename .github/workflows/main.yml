name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract ElLamma project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'ElLamma_FINAL_1.1.4.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ElLamma_FINAL_1.1.4.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/settings.gradle" ] && [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_ROOT=extracted" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --no-daemon

      - name: Sign Release APK with permanent key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.ELLAMMA_KEYSTORE_BASE64 }}
        run: |
          set -e

          UNSIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release-aligned.apk"
          SIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"
          KEYSTORE="$RUNNER_TEMP/ellamma-release.keystore"

          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Unsigned APK was not generated"
            find "$PROJECT_ROOT" -type f -name "*.apk" -print
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Required signing secrets are missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: Keystore could not be decoded"
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -x "$BUILD_TOOLS/zipalign" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "ERROR: Android Build Tools 35.0.0 not found"
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$SIGNED"

          echo "Permanent signing completed successfully."
          ls -lh "$SIGNED"

          rm -f "$KEYSTORE" "$ALIGNED"

      - name: Calculate SHA256
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"

          sha256sum "$APK" > app-release-sha256.txt

          cat app-release-sha256.txt

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-Release-Signed-Permanent
          path: |
            extracted/app/build/outputs/apk/release/ElLamma-release.apk
            app-release-sha256.txt
          if-no-files-found: error
