name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract ElLamma project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'ElLamma_FINAL_1.1.4.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ElLamma_FINAL_1.1.4.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/settings.gradle" ] && [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_ROOT=extracted" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --no-daemon

      - name: Sign Release APK with permanent key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELLAMMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELLAMMA_KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.ELLAMMA_KEYSTORE_BASE64 }}
        run: |
          set -e

          UNSIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release-aligned.apk"
          SIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"
          KEYSTORE="$RUNNER_TEMP/ellamma-release.keystore"

          echo "Checking release APK..."

          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Unsigned APK was not generated"
            find "$PROJECT_ROOT" -type f -name "*.apk" -print
            exit 1
          fi

          echo "Checking signing secrets..."

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ELLAMMA_KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ELLAMMA_KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ELLAMMA_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "Decoding permanent keystore..."

          python3 - "$KEYSTORE" "$KEYSTORE_BASE64" <<'PY'
          import base64
          import sys

          output_file = sys.argv[1]
          encoded = sys.argv[2]

          encoded = "".join(encoded.split())

          encoded += "=" * ((4 - len(encoded) % 4) % 4)

          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception as e:
              print("ERROR: Invalid ELLAMMA_KEYSTORE_BASE64")
              print(str(e))
              sys.exit(1)

          if not data:
              print("ERROR: Decoded keystore is empty")
              sys.exit(1)

          with open(output_file, "wb") as f:
              f.write(data)
          PY

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: Keystore could not be created"
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -x "$BUILD_TOOLS/zipalign" ]; then
            echo "ERROR: zipalign was not found"
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "ERROR: apksigner was not found"
            exit 1
          fi

          echo "Validating permanent keystore..."

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore validation successful."

          echo "Aligning APK..."

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          echo "Signing APK..."

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          echo "Verifying APK signature..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$SIGNED"

          echo "Permanent signing completed successfully."

          ls -lh "$SIGNED"

          rm -f "$KEYSTORE"
          rm -f "$ALIGNED"

      - name: Calculate SHA256
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/release/ElLamma-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK not found"
            exit 1
          fi

          sha256sum "$APK" > app-release-sha256.txt

          echo "SHA256:"
          cat app-release-sha256.txt

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-Release-Signed-Permanent
          path: |
            extracted/app/build/outputs/apk/release/ElLamma-release.apk
            app-release-sha256.txt
          if-no-files-found: error
