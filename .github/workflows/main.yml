name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q ElLamma_FINAL_1.1.4.zip -d project

      - name: Locate Android project
        run: |
          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          test -n "$APK"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/ElLamma-release-sha256.txt"
          cp "$APK" "$GITHUB_WORKSPACE/ElLamma-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-Release
          path: |
            ElLamma-release.apk
            ElLamma-release-sha256.txt
