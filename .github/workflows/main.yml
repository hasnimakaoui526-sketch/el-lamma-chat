name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract ElLamma project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'ElLamma_FINAL_1.1.4.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ElLamma_FINAL_1.1.4.zip not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          GRADLEW_FILE="$(find extracted -type f -name 'gradlew' -print -quit)"

          if [ -z "$GRADLEW_FILE" ]; then
            echo "ERROR: gradlew was not found inside the ZIP"
            echo "Project contents:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$GRADLEW_FILE")"

          echo "Android project found at: $PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          test -f ./gradlew

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated"
            find "$PROJECT_ROOT" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          sha256sum "$APK" > app-release-sha256.txt

          cat app-release-sha256.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-Release
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/app-release.apk
            app-release-sha256.txt
          if-no-files-found: error
