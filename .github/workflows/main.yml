      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated"
            find "$PROJECT_ROOT" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          sha256sum "$APK" > app-release-sha256.txt
          cat app-release-sha256.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-Release
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/app-release-unsigned.apk
            app-release-sha256.txt
          if-no-files-found: error
