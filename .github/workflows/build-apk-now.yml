name: Build FINAL ElLamma APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, align and sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ElLamma_FINAL_1.1.8_FINAL_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_ROOT="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_ROOT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/unsigned.apk"

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$GITHUB_WORKSPACE/unsigned.apk" \
            "$GITHUB_WORKSPACE/aligned.apk"

          "$BUILD_TOOLS/zipalign" -c -v 4 \
            "$GITHUB_WORKSPACE/aligned.apk"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ellamma-ci.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias ellamma \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ElLamma CI,O=ElLamma,C=DZ"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ellamma-ci.jks" \
            --ks-key-alias ellamma \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$GITHUB_WORKSPACE/ElLamma-FINAL-1.1.8.apk" \
            "$GITHUB_WORKSPACE/aligned.apk"

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/ElLamma-FINAL-1.1.8.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"

          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/ElLamma-FINAL-1.1.8.sha256"

          echo "APK SIGNATURE VERIFICATION PASSED"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-FINAL-1.1.8
          path: |
            ElLamma-FINAL-1.1.8.apk
            ElLamma-FINAL-1.1.8.sha256
          if-no-files-found: error
          retention-days: 14
