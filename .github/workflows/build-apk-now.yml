name: Build FINAL ElLamma 1.1.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify FINAL APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Locate FINAL 1.1.8 source
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done < <(
            find . \
              -type f \
              -name 'ElLamma_FINAL_1.1.8_FINAL_FIXED.zip' \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FINAL 1.1.8 source ZIP was not found."
            echo "Available ZIP files:"
            find . -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "FINAL SOURCE:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/settings.gradle" ] && \
             [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not found inside FINAL 1.1.8 ZIP."
            exit 1
          fi

          echo "PROJECT_ROOT=extracted" >> "$GITHUB_ENV"

      - name: Verify FINAL source
        shell: bash
        run: |
          set -e

          GRADLE_FILE="extracted/app/build.gradle"
          HTML_FILE="extracted/app/src/main/assets/el-lamma-chat.html"
          JAVA_FILE="extracted/app/src/main/java/com/ellamma/chat/MainActivity.java"

          test -f "$GRADLE_FILE"
          test -f "$HTML_FILE"
          test -f "$JAVA_FILE"

          echo "Checking version..."
          grep -Fq "versionName '1.1.8'" "$GRADLE_FILE"

          echo "Checking production API..."
          grep -Fq \
            "https://bfbzgzletoaxyazugjex.supabase.co/functions/v1/api" \
            "$HTML_FILE"

          echo "Checking presence..."
          grep -Fq "/presence" "$HTML_FILE"

          echo "Checking profile avatar..."
          grep -Fq "/profile/avatar" "$HTML_FILE"

          echo "Checking owner AI..."
          grep -Fq "/owner/ai" "$HTML_FILE"

          echo "Checking announcements..."
          grep -Fq "/announcements" "$HTML_FILE"

          echo "Checking friend wall..."
          grep -Fq "/friend-wall" "$HTML_FILE"

          echo "Checking rich users..."
          grep -Fq "/rich" "$HTML_FILE"

          echo "Checking private messages..."
          grep -Fq "/private/conversations" "$HTML_FILE"

          echo "Checking rooms..."
          grep -Fq "/rooms" "$HTML_FILE"

          echo "Checking games..."
          grep -Fq "/games/" "$HTML_FILE"

          echo "Checking tournaments..."
          grep -Fq "/tournaments" "$HTML_FILE"

          echo "Checking seasons..."
          grep -Fq "/seasons/" "$HTML_FILE"

          echo "Checking cosmetics..."
          grep -Fq "/cosmetics" "$HTML_FILE"

          echo "Checking logout..."
          grep -Fq "bottomLogout" "$HTML_FILE"
          grep -Fq "logout()" "$HTML_FILE"

          echo "Checking Android file chooser..."
          grep -Fq "onShowFileChooser" "$JAVA_FILE"

          echo "Checking fullscreen..."
          grep -Fq "enterFullscreen" "$JAVA_FILE"

          echo
          echo "========================================"
          echo "FINAL SOURCE VERIFICATION PASSED"
          echo "VERSION: 1.1.8"
          echo "========================================"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          ./gradle-8.9/bin/gradle --version

      - name: Build FINAL APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle :app:assembleDebug --no-daemon

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/ElLamma-FINAL-1.1.8.apk"

          echo
          echo "APK CREATED:"
          ls -lh "$GITHUB_WORKSPACE/ElLamma-FINAL-1.1.8.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/ElLamma-FINAL-1.1.8.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK SIGNATURE VERIFICATION PASSED"

      - name: Verify FINAL APK contents
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/ElLamma-FINAL-1.1.8.apk"

          rm -f final-html-check.html

          unzip -p \
            "$APK" \
            assets/el-lamma-chat.html \
            > final-html-check.html

          test -s final-html-check.html

          echo "Checking production API..."
          grep -Fq \
            "https://bfbzgzletoaxyazugjex.supabase.co/functions/v1/api" \
            final-html-check.html

          echo "Checking presence..."
          grep -Fq "/presence" final-html-check.html

          echo "Checking avatar..."
          grep -Fq "/profile/avatar" final-html-check.html

          echo "Checking owner AI..."
          grep -Fq "/owner/ai" final-html-check.html

          echo "Checking announcements..."
          grep -Fq "/announcements" final-html-check.html

          echo "Checking friend wall..."
          grep -Fq "/friend-wall" final-html-check.html

          echo "Checking rich users..."
          grep -Fq "/rich" final-html-check.html

          echo "Checking private messages..."
          grep -Fq "/private/conversations" final-html-check.html

          echo "Checking games..."
          grep -Fq "/games/" final-html-check.html

          echo "Checking tournaments..."
          grep -Fq "/tournaments" final-html-check.html

          echo "Checking seasons..."
          grep -Fq "/seasons/" final-html-check.html

          echo "Checking cosmetics..."
          grep -Fq "/cosmetics" final-html-check.html

          echo "Checking logout..."
          grep -Fq "bottomLogout" final-html-check.html
          grep -Fq "logout()" final-html-check.html

          echo
          echo "========================================"
          echo "FINAL APK CONTENT VERIFICATION PASSED"
          echo "========================================"

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          sha256sum \
            ElLamma-FINAL-1.1.8.apk \
            | tee ElLamma-FINAL-1.1.8.sha256

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-FINAL-1.1.8
          path: |
            ElLamma-FINAL-1.1.8.apk
            ElLamma-FINAL-1.1.8.sha256
          if-no-files-found: error
