name: Build APK Now

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find and extract project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'ElLamma_FINAL_1.1.4.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            rm -rf extracted
            mkdir extracted
            unzip -q "$ZIP_FILE" -d extracted
            ROOT="extracted"
          else
            ROOT="."
          fi
          if [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f | sort || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > app-debug-sha256.txt
          cat app-debug-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ElLamma-APK-Installable
          path: |
            extracted/app/build/outputs/apk/debug/app-debug.apk
            app-debug-sha256.txt
          if-no-files-found: error
